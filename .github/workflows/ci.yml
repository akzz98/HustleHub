name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-not-for-production
      JWT_EXPIRES_IN: 1h
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Audit production dependencies
        # Fail on high/critical in runtime deps only. Remaining issues sit in
        # newman/jest and need breaking --force downgrades, so they stay out of this gate.
        run: npm audit --omit=dev --audit-level=high

      - name: Run backend tests
        run: npm test

      - name: Load API module
        run: node -e "require('./src/app'); console.log('api module loaded')"
        env:
          NODE_ENV: test
          JWT_SECRET: ci-jwt-secret-not-for-production
          CLIENT_ORIGIN: http://localhost:5173

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run oxlint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ""

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Semgrep static analysis
        run: |
          mkdir -p evidence
          semgrep scan --config p/javascript --config p/nodejs --json --output evidence/semgrep-results.json
          semgrep scan --config p/javascript --config p/nodejs --error | tee evidence/semgrep-cli.txt

      - name: Upload Semgrep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-evidence
          path: |
            evidence/semgrep-results.json
            evidence/semgrep-cli.txt

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t hustlehub-api:ci .

      - name: Build client image
        run: docker build -t hustlehub-client:ci ./client

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI .env
        run: |
          printf '%s\n' \
            'JWT_SECRET=ci-compose-jwt-secret-not-for-production' \
            'JWT_EXPIRES_IN=1h' \
            'CLIENT_ORIGIN=http://localhost:8080' > .env

      - name: Generate TLS certificates
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout certs/localhost-key.pem \
            -out certs/localhost.pem \
            -days 1 \
            -subj "/CN=localhost"

      - name: Start Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build -d

      - name: Wait for client and API
        run: |
          set -e
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/ >/dev/null \
              && curl -skf https://localhost:3000/ >/dev/null; then
              echo "stack is reachable"
              exit 0
            fi
            echo "waiting ($i)..."
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1

      - name: Live check client
        run: |
          curl -sf http://localhost:8080/ | head -c 200
          echo
          curl -sf -o /dev/null -w "client_http=%{http_code}\n" http://localhost:8080/

      - name: Live check API
        run: |
          curl -skf https://localhost:3000/
          echo
          curl -skf http://localhost:8080/api/gigs
          echo

      - name: Stop Compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
