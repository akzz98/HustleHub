name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-not-for-production
      JWT_EXPIRES_IN: 1h
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Load API module
        run: node -e "require('./src/app'); console.log('api module loaded')"
        env:
          NODE_ENV: test
          JWT_SECRET: ci-jwt-secret-not-for-production
          CLIENT_ORIGIN: http://localhost:5173

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ""

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Semgrep static analysis
        run: |
          mkdir -p evidence
          semgrep scan --config p/javascript --config p/nodejs --json --output evidence/semgrep-results.json
          semgrep scan --config p/javascript --config p/nodejs --error | tee evidence/semgrep-cli.txt

      - name: Upload Semgrep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-evidence
          path: |
            evidence/semgrep-results.json
            evidence/semgrep-cli.txt
